<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>相似图去重</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="header">
      <h1>相似图去重</h1>
      <p class="sub">感知哈希分组 · 预览后批量删除</p>
    </header>

    <section class="panel scan-panel">
      <label class="field">
        <span>文件夹路径</span>
        <div class="path-row">
          <input id="pathInput" type="text" placeholder="C:\c_git_project\anima_train\datasets\natsume_an-an\images" />
          <button id="browseBtn" type="button" class="btn ghost">选择文件夹…</button>
        </div>
      </label>
      <div class="row">
        <label class="field compact">
          <span>阈值</span>
          <input id="thresholdInput" type="number" min="0" max="32" value="8" />
        </label>
        <label class="field compact">
          <span>算法</span>
          <select id="methodInput">
            <option value="phash" selected>phash</option>
            <option value="dhash">dhash</option>
            <option value="ahash">ahash</option>
            <option value="whash">whash</option>
          </select>
        </label>
        <label class="check">
          <input id="recursiveInput" type="checkbox" />
          包含子目录
        </label>
        <button id="scanBtn" type="button" class="btn primary">开始扫描</button>
      </div>
      <p id="scanStatus" class="status" hidden></p>
    </section>

    <section id="toolbar" class="toolbar" hidden>
      <span id="summaryText"></span>
      <span id="selectedText">已选 0 张</span>
      <button id="deleteBtn" type="button" class="btn danger" disabled>批量删除选中</button>
    </section>

    <main id="groupsRoot" class="groups"></main>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <button type="button" class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
      <img id="lightboxImg" alt="" />
      <p id="lightboxCaption"></p>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
